name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-check:
    name: Release checks (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            runner: ubuntu-latest
            system: x86_64-linux
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
            system: aarch64-linux
          - name: aarch64-darwin
            runner: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Run flake checks
        run: nix flake check --print-build-logs --system ${{ matrix.system }}

      - name: Build plugin package
        run: nix build --system ${{ matrix.system }} .#neotest-nix --print-build-logs

      - name: Run real-nix integration specs
        if: matrix.system == 'x86_64-linux'
        env:
          NEOTEST_NIX_INTEGRATION: '1'
        run: nix develop -c vusted tests/integration/

  release-please:
    name: Release Please
    needs: release-check
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify validated commit is current main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        if: vars.CI_APP_ID
        id: app-token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  luarocks-upload:
    name: LuaRocks Upload
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Verify release tag matches validated commit
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$RELEASE_SHA" = "$GITHUB_SHA"

      - name: Publish to LuaRocks
        uses: nvim-neorocks/luarocks-tag-release@v7
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        with:
          version: ${{ needs.release-please.outputs.tag_name }}
          summary: A Neotest adapter for Nix tests.
          dependencies: |
            neotest
            nvim-nio
          copy_directories: |
            {{ neovim.plugin.dirs }}
          labels: |
            neovim
            neotest
            nix
